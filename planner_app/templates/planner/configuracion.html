{% extends "planner/base.html" %}{% load static %}
{% block content %}
<div class="row g-4">
  <div class="col-lg-5">
    <div class="card mb-4"><div class="card-body">
      <h6>Rango horario de la grilla</h6>
      <p class="text-muted small">Define qué horas se ven en la vista semanal. Si cargás una actividad fuera del rango, la grilla se amplía sola.</p>
      <form class="row g-2 align-items-end" id="cfgForm">
        <div class="col"><label class="form-label">Desde</label><select class="form-select" name="grilla_desde"></select></div>
        <div class="col"><label class="form-label">Hasta</label><select class="form-select" name="grilla_hasta"></select></div>
        <div class="col-auto"><button class="btn btn-primary">Guardar</button></div>
      </form>
    </div></div>
    <div class="card"><div class="card-body">
      <h6>Categorías</h6>
      <div id="cats" class="vstack gap-2"></div>
      <button class="btn btn-outline-primary btn-sm mt-3" id="addCat">+ Categoría</button>
    </div></div>
  </div>
  <div class="col-lg-7">
    <div class="card"><div class="card-body">
      <div class="d-flex align-items-center mb-2"><h6 class="mb-0">Horarios</h6>
        <button class="btn btn-primary btn-sm ms-auto" id="addBloque">+ Horario</button></div>
      <div id="horarios"></div>
    </div></div>
  </div>
</div>
<form method="post" action="{% url 'logout' %}" class="d-md-none mt-4 text-center">{% csrf_token %}<button class="btn btn-outline-secondary">Cerrar sesión</button></form>
{% endblock %}
{% block scripts %}<script src="{% static 'planner/config.js' %}"></script>{% endblock %}
